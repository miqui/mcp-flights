[project]
name = "mcp-flights"
version = "0.1.0"
description = "FastMCP server exposing SerpAPI Google Flights search as an MCP tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastmcp==3.2.4",
  "httpx==0.28.1",
  "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.11.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
